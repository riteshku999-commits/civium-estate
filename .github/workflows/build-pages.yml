# Rebuilds the SEO pages (/properties/, /areas/, sitemap.xml) whenever listings change.
# Edits to data/properties.json (e.g. from the Listings Manager) trigger this automatically.
name: Build property pages

on:
  push:
    branches: [main]
    paths:
      - "data/properties.json"
      - "data/contact.json"
      - "data/areas.json"
      - "tools/**"
      - "index.html"
      - "css/pages.css"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate pages
        run: node tools/build-pages.mjs
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A properties areas sitemap.xml data/.page-state.json
          if git diff --cached --quiet; then
            echo "No changes to generated pages."
          else
            git commit -m "Rebuild property pages [skip ci]"
            git pull --rebase origin main
            git push
          fi
